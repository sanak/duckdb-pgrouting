# SPDX-License-Identifier: GPL-2.0-or-later
# Builds and tests the extension on every DuckDB platform (native tests; Wasm builds only)
# using DuckDB's reusable extension workflow.
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main, v2.0-cyanoptera]
    # A pushed release tag builds its own run, so the binaries report the tag as their version
    # (a build reports a tag only when its checkout contains it) and the release job below can
    # publish them.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/v2.0-cyanoptera') || github.sha }}
  cancel-in-progress: true

# Two release lines until DuckDB 2.0.0 ships. The stable line is main, built against the latest
# DuckDB v1.5 release; it is what users install and where tags are cut. The next line is the
# v2.0-cyanoptera branch, built against DuckDB's branch of that name. Both branches carry this
# same file and each one disables the job that is not its own, so a change here cherry-picks
# between them unchanged.
#
# reduced_ci_mode is left at its upstream default, which gates osx/windows/wasm on the linux job
# and turns fail-fast on: a broken build then reports as one job instead of nine. WasmTests.yml
# separately builds and runs the tests for all three Wasm variants.
#
# vcpkg_commit is pinned to duckdb-spatial's vcpkg commit on purpose, not extension-ci-tools' newer
# default: this is the commit every build here was validated against, and a different Boost can
# move equal-cost ties. Do not "fix" it.
jobs:
  duckdb-stable-build:
    name: Build extension binaries (stable)
    if: false # enabled on the main branch only
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: pgrouting
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35

  duckdb-next-build:
    name: Build extension binaries (next)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: pgrouting
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35

  # Turns a tag's build into a draft GitHub Release. It needs the stable job, which is disabled on
  # v2.0-cyanoptera, so a tag there skips this job too: releases are cut on main only. The
  # Release stays a draft on purpose. A human reviews and publishes it, and only a Release
  # published by a person (not by this job's GITHUB_TOKEN) starts other workflows on publication.
  release:
    name: Draft GitHub Release
    needs: duckdb-stable-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # pgr_version() is checked against the pgRouting version the submodule records.
      - name: Check out the pgRouting submodule
        run: git submodule update --init third_party/pgrouting

      - uses: actions/download-artifact@v8
        with:
          pattern: pgrouting-*-extension-*
          path: ${{ runner.temp }}/artifacts

      # The released CLI of the version the artifacts were built for: the published binaries are
      # verified in the same DuckDB a user will load them into.
      - name: Download the matching DuckDB CLI
        run: |
          DUCKDB_VERSION=$(python3 scripts/release_assets.py duckdb-version --artifacts "$RUNNER_TEMP/artifacts")
          gh release download "$DUCKDB_VERSION" -R duckdb/duckdb -p duckdb_cli-linux-amd64.zip -D "$RUNNER_TEMP/cli"
          unzip -q "$RUNNER_TEMP/cli/duckdb_cli-linux-amd64.zip" -d "$RUNNER_TEMP/cli"
          echo "DUCKDB_VERSION=$DUCKDB_VERSION" >> "$GITHUB_ENV"

      - name: Verify the build and prepare the assets
        run: |
          python3 scripts/release_assets.py build \
            --artifacts "$RUNNER_TEMP/artifacts" --out "$RUNNER_TEMP/release" \
            --notes "$RUNNER_TEMP/notes.md" --tag "$TAG" --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --cli "$RUNNER_TEMP/cli/duckdb" \
            --pgrouting-cmakelists third_party/pgrouting/CMakeLists.txt

      # Re-running this job replaces its own earlier draft; a published Release is never touched.
      - name: Create the draft Release
        run: |
          if state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "::error::Release $TAG is already published; not replacing it"
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag "${prerelease[@]}" \
            --title "pgrouting $TAG for DuckDB $DUCKDB_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/release/*
