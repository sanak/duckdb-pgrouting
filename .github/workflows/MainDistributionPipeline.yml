# Builds and tests the extension on every DuckDB platform (native tests; Wasm builds only)
# using DuckDB's reusable extension workflow.
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-latest-build:
    name: Build extension binaries
    # On pull_request the reusable workflow reduces its matrix and builds only wasm_eh of the three
    # Wasm variants; WasmTests.yml builds and tests all three on every pull request.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: routing
      # TEMPORARY: forces every platform to report independently on this first full-matrix run,
      # instead of hiding eight platforms behind the linux job. Remove this line once CI is green.
      reduced_ci_mode: disabled
      # Pinned to duckdb-spatial's vcpkg commit on purpose, not extension-ci-tools' newer default:
      # this is the commit every local build here was validated against. Do not "fix" it.
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
